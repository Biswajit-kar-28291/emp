<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Student Profile | EMP</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light"><nav class="navbar bg-primary" data-bs-theme="dark"><div class="container"><a class="navbar-brand" href="{{ url_for('student_dashboard', user_id=user.id) }}">Student Dashboard</a></div></nav><main class="container py-5"><div class="row justify-content-center"><div class="col-12 col-md-8 col-lg-6"><div class="d-flex justify-content-between align-items-center mb-4"><h1 class="h3 mb-0">Edit Profile</h1><a class="btn btn-outline-primary" href="{{ url_for('student_dashboard', user_id=user.id) }}">Back</a></div>{% if message %}<div class="alert alert-success">{{ message }}</div>{% endif %}{% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}<form method="post" class="card border-0 shadow-sm"><div class="card-body p-4"><div class="mb-3"><label class="form-label" for="full_name">Full name</label><input class="form-control" id="full_name" name="full_name" value="{{ user.student_profile.full_name }}" required></div><div class="mb-3"><label class="form-label" for="student_id">Student ID</label><input class="form-control" id="student_id" name="student_id" value="{{ user.student_profile.student_id or '' }}"></div><div class="mb-4"><label class="form-label" for="email">Email</label><input class="form-control" id="email" value="{{ user.email }}" disabled><div class="form-text">Login email cannot be changed here.</div></div><button class="btn btn-primary" type="submit">Save Profile</button></div></form></div></div></main></body></html>
