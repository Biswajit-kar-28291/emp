<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register | Examination Management Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light min-vh-100 d-flex flex-column">
    <nav class="navbar bg-primary" data-bs-theme="dark">
        <div class="container">
            <a class="navbar-brand fw-semibold" href="{{ url_for('login') }}">Examination Management Portal</a>
            <a class="btn btn-outline-light btn-sm" href="{{ url_for('login') }}">Login</a>
        </div>
    </nav>

    <main class="container flex-grow-1 py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-6">
                <div class="card border-0 shadow-sm">
                    <div class="card-body p-4 p-md-5">
                        <div class="text-center mb-4">
                            <h1 class="h3 mb-2">Create an account</h1>
                            <p class="text-secondary mb-0">Register as a Student or Examiner</p>
                        </div>

                        {% if error %}
                            <div class="alert alert-danger" role="alert">{{ error }}</div>
                        {% endif %}

                        <form action="{{ url_for('register') }}" method="post">
                            <div class="mb-3">
                                <label for="full_name" class="form-label">Full name</label>
                                <input type="text" class="form-control" id="full_name" name="full_name"
                                       placeholder="Enter your full name" required autofocus>
                            </div>
                            <div class="mb-3">
                                <label for="email" class="form-label">Email address</label>
                                <input type="email" class="form-control" id="email" name="email"
                                       placeholder="name@example.com" required>
                            </div>
                            <div class="mb-3">
                                <label for="role" class="form-label">Register as</label>
                                <select class="form-select" id="role" name="role" required>
                                    <option value="" selected disabled>Select a role</option>
                                    <option value="student">Student</option>
                                    <option value="examiner">Examiner</option>
                                </select>
                            </div>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="password" class="form-label">Password</label>
                                    <input type="password" class="form-control" id="password" name="password"
                                           placeholder="Enter password" required>
                                </div>
                                <div class="col-md-6 mb-4">
                                    <label for="confirm_password" class="form-label">Confirm password</label>
                                    <input type="password" class="form-control" id="confirm_password"
                                           name="confirm_password" placeholder="Repeat password" required>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Register</button>
                        </form>

                        <p class="text-center text-secondary mt-4 mb-0">
                            Already have an account?
                            <a href="{{ url_for('login') }}">Login</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="border-top bg-white py-3">
        <div class="container text-center text-secondary small">
            Examination Management Portal
        </div>
    </footer>
</body>
</html>
