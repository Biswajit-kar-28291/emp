<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Edit Slot | EMP</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="bg-light">{% include 'examiner/navigation.html' %}<main class="container py-5"><div class="row justify-content-center"><div class="col-lg-7"><h1 class="h3">Edit Slot</h1><p class="text-secondary">{{ slot.examination.exam_name }}</p>{% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}<form method="post" class="card border-0 shadow-sm"><div class="card-body row g-3"><div class="col-md-6"><label class="form-label" for="date">Date</label><input class="form-control" type="date" id="date" name="date" value="{{ slot.date.isoformat() }}" required></div><div class="col-md-6"><label class="form-label" for="max_capacity">Maximum capacity</label><input class="form-control" type="number" min="1" id="max_capacity" name="max_capacity" value="{{ slot.max_capacity }}" required></div><div class="col-md-6"><label class="form-label" for="start_time">Start time</label><input class="form-control" type="time" id="start_time" name="start_time" value="{{ slot.start_time.strftime('%H:%M') }}" required></div><div class="col-md-6"><label class="form-label" for="end_time">End time</label><input class="form-control" type="time" id="end_time" name="end_time" value="{{ slot.end_time.strftime('%H:%M') }}" required></div><div><button class="btn btn-primary">Save Changes</button> <a class="btn btn-outline-secondary" href="{{ url_for('examiner_slots', user_id=user.id) }}">Cancel</a></div></div></form></div></div></main></body></html>
