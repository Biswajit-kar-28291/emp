<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Examiner Profile | EMP</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="bg-light">{% include 'examiner/navigation.html' %}<main class="container py-5"><div class="row justify-content-center"><div class="col-lg-7"><h1 class="h3 mb-4">Examiner Profile</h1>{% if message %}<div class="alert alert-success">{{ message }}</div>{% endif %}{% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}<form method="post" class="card border-0 shadow-sm"><div class="card-body"><div class="mb-3"><label class="form-label" for="full_name">Full name</label><input class="form-control" id="full_name" name="full_name" value="{{ user.examiner_profile.full_name }}" required></div><div class="mb-3"><label class="form-label" for="examiner_id">Examiner ID</label><input class="form-control" id="examiner_id" name="examiner_id" value="{{ user.examiner_profile.examiner_id or '' }}"></div><div class="mb-3"><label class="form-label" for="contact_details">Contact details</label><input class="form-control" id="contact_details" name="contact_details" value="{{ user.examiner_profile.contact_details or '' }}"></div><div class="mb-3"><label class="form-label" for="department">Department</label><input class="form-control" id="department" name="department" value="{{ user.examiner_profile.department or '' }}"></div><div class="mb-4"><label class="form-label">Email</label><input class="form-control" value="{{ user.email }}" disabled><div class="form-text">Role, approval, profile activity, account status, and login email cannot be changed here.</div></div><button class="btn btn-primary">Save Profile</button></div></form></div></div></main></body></html>
