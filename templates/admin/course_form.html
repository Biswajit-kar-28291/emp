{% extends 'admin/base.html' %}{% block content %}<h1 class="h3">Edit Course</h1><form method="post" class="card card-body border-0 shadow-sm"><label class="form-label">Course code</label><input class="form-control mb-3" name="course_code" value="{{ course.course_code }}" required><label class="form-label">Course name</label><input class="form-control mb-3" name="course_name" value="{{ course.course_name }}" required><label class="form-label">Description</label><textarea class="form-control mb-3" name="description">{{ course.description or '' }}</textarea><div><button class="btn btn-primary">Save</button> <a class="btn btn-outline-secondary" href="{{ url_for('admin_courses', user_id=user.id) }}">Cancel</a></div></form>{% endblock %}
