{% extends 'admin/base.html' %}{% block content %}<h1 class="h3">Edit Examiner</h1><form method="post" class="card card-body border-0 shadow-sm"><label class="form-label">Full name</label><input class="form-control mb-3" name="full_name" value="{{ examiner.examiner_profile.full_name }}" required><label class="form-label">Examiner ID</label><input class="form-control mb-3" name="examiner_id" value="{{ examiner.examiner_profile.examiner_id or '' }}"><label class="form-label">Department</label><input class="form-control mb-3" name="department" value="{{ examiner.examiner_profile.department or '' }}"><label class="form-label">Contact information</label><input class="form-control mb-3" name="contact_details" value="{{ examiner.examiner_profile.contact_details or '' }}"><div><button class="btn btn-primary">Save</button> <a class="btn btn-outline-secondary" href="{{ url_for('admin_examiners', user_id=user.id) }}">Cancel</a></div></form>{% endblock %}
