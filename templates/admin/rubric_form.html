{% extends 'admin/base.html' %}{% block content %}<h1 class="h3">Edit Rubric</h1><form method="post" class="card card-body border-0 shadow-sm"><label class="form-label">Criterion name</label><input class="form-control mb-3" name="criterion_name" value="{{ rubric.criterion_name }}" required><label class="form-label">Maximum marks</label><input type="number" min="1" class="form-control mb-3" name="maximum_marks" value="{{ rubric.maximum_marks }}" required><label class="form-label">Weightage</label><input type="number" min="1" max="100" class="form-control mb-3" name="weightage" value="{{ rubric.weightage }}" required><label class="form-label">Description</label><textarea class="form-control mb-3" name="description">{{ rubric.description or '' }}</textarea><div><button class="btn btn-primary">Save</button> <a class="btn btn-outline-secondary" href="{{ url_for('admin_rubrics', user_id=user.id, examination_id=rubric.examination_id) }}">Cancel</a></div></form>{% endblock %}
