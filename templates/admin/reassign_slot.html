{% extends 'admin/base.html' %}{% block content %}<h1 class="h3">Reassign Slot Examiner</h1><div class="card card-body border-0 shadow-sm"><p><strong>{{ slot.examination.exam_name }}</strong><br>{{ slot.date.strftime('%d %b %Y') }}, {{ slot.start_time.strftime('%H:%M') }}–{{ slot.end_time.strftime('%H:%M') }}</p><form method="post"><label class="form-label">New approved, assigned Examiner</label><select class="form-select mb-3" name="examiner_id" required><option value="">Select</option>{% for examiner in examiners %}<option value="{{ examiner.id }}">{{ examiner.examiner_profile.full_name }}</option>{% endfor %}</select><button class="btn btn-primary">Reassign</button> <a class="btn btn-outline-secondary" href="{{ url_for('admin_slots', user_id=user.id) }}">Cancel</a></form></div>{% endblock %}
